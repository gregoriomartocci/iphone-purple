name: CI

# staging va a la par de main a propósito: es la rama que se mira antes de
# publicar, así que tiene que pasar exactamente los mismos controles. Una
# pre-producción con la vara más baja que producción no sirve para nada.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Un push nuevo cancela el run anterior de la misma rama: no tiene sentido
# gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm run test

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El build corre sin secretos a propósito: verifica que el sitio se
      # construye con la capa de datos en modo semilla, que es como arranca
      # cualquiera que clone el repo.
      - name: Build
        run: npm run build

  security:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La auditoría va en dos pasos, y solo el primero frena el merge.
      #
      # Lo que llega al cliente es el árbol de producción, y ahí la vara es
      # cero: cualquier vulnerabilidad alta o crítica corta el merge. Con
      # "moderate" el ruido de dependencias transitivas vuelve inútil la señal.
      #
      # Las de desarrollo se listan pero no bloquean. No es dejarlas pasar: es
      # que un DoS dentro de eslint no es explotable contra la tienda, y las
      # que quedan hoy solo "se arreglan" bajando eslint-config-next dos
      # versiones mayores. Bloquear por eso significa no poder publicar un
      # arreglo real de producción, que es peor. El listado queda a la vista en
      # el log para revisarlo cuando haya arreglo de verdad.
      - name: Auditoría de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría de desarrollo (informativa)
        run: npm audit --audit-level=high || true

      - name: Buscar secretos commiteados
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::Hay un archivo .env commiteado. Sacalo del repo y rotá esas claves."
            exit 1
          fi
          echo "OK: no hay archivos .env versionados."
